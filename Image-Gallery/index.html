<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">

     <img src="images/img1.jpg" alt="Shivvayya">
<img src="images/img2.jpg" alt="Hanuman">
<img src="images/img3.jpg" alt="Vinayaka">
<img src="images/img4.jpg" alt="Radha Krishna">
<img src="images/img5.jpg" alt="Beautiful Nature 5">
<img src="images/img6.jpg" alt="Beautiful Nature 6">
<img src="images/img7.jpg" alt="Beautiful Nature 7">
<img src="images/img8.jpg" alt="Beautiful Nature 8">
    </div>

    <!-- Lightbox / Modal -->
    <div class="modal" id="modal">

        <span class="close">&times;</span>

        <img class="modal-content" id="modalImage" alt="Large Preview">

    </div>

    <script src="script.js"></script>

</body>
</html>
