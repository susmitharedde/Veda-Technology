<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>💰 Tip Calculator</h1>

        <div class="input-group">
            <label for="bill">Bill Amount (₹)</label>
            <input type="number" id="bill" placeholder="Enter bill amount">
        </div>

        <div class="input-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" placeholder="Enter tip percentage">
        </div>

        <div class="input-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" placeholder="Enter number of people">
        </div>

        <div class="result">
            <h3>Tip Per Person</h3>
            <p id="tipPerPerson">₹0.00</p>

            <h3>Total Per Person</h3>
            <p id="totalPerPerson">₹0.00</p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
