<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="password-box">

            <h1>Random Password Generator</h1>
            <p>Create strong and secure passwords instantly.</p>

            <!-- Password Display -->
            <div class="display">
                <input
                    type="text"
                    id="password"
                    placeholder="Your password"
                    readonly
                >

                <button id="copyBtn" title="Copy Password">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <!-- Password Length -->
            <div class="setting">
                <label for="length">
                    Password Length:
                    <span id="lengthValue">12</span>
                </label>

                <input
                    type="range"
                    id="length"
                    min="4"
                    max="30"
                    value="12"
                >
            </div>

            <!-- Character Options -->
            <div class="options">

                <label>
                    <input
                        type="checkbox"
                        id="uppercase"
                        checked
                    >
                    Include Uppercase (A-Z)
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="lowercase"
                        checked
                    >
                    Include Lowercase (a-z)
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="numbers"
                        checked
                    >
                    Include Numbers (0-9)
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="symbols"
                    >
                    Include Symbols (!@#$%)
                </label>

            </div>

            <!-- Generate Button -->
            <button id="generateBtn" class="generate-btn">
                Generate Password
            </button>

            <!-- Message -->
            <p id="message"></p>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
