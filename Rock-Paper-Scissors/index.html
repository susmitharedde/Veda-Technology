<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Rock Paper Scissors</h1>

        <div class="buttons">
            <button onclick="playGame('Rock')">✊ Rock</button>
            <button onclick="playGame('Paper')">✋ Paper</button>
            <button onclick="playGame('Scissors')">✌️ Scissors</button>
        </div>

        <div class="result-box">
            <p><strong>Your Choice:</strong> <span id="userChoice">-</span></p>
            <p><strong>Computer Choice:</strong> <span id="computerChoice">-</span></p>
            <h2 id="result">Make Your Move!</h2>
        </div>

        <div class="score">
            <h3>Player Score: <span id="playerScore">0</span></h3>
            <h3>Computer Score: <span id="computerScore">0</span></h3>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Score</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
